<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Manutenção-Máquinas</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/formulario.css">
    <script src="/js/main.js" defer></script>
    <script src="/js/maquinas.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <a href="/index.html" class="voltar">&larr; Página inicial</a>
        </nav>
        <h1>Máquinas</h1>
    </header>

    <main>
        <section class="formulario">
            <label for="codigo">Código</label>
            <input type="text" id="codigo" placeholder="Ex.: EQ-01">

            <label for="nome">Nome do equipamento</label>
            <input type="text" id="nome" placeholder="Ex.: Torno CNC">

            <label for="setor">Setor</label>
            <select id="setor">
                <option value="">Selecione</option>
            </select>

            <label for="horasMes">Horas de operação por mês</label>
            <input type="number" id="horasMes" min="0" step="any" placeholder="Ex.: 720">

            <button type="button" id="btnCadastrar">Cadastrar</button>
            <p id="mensagem"></p>
        </section>

        <h2>Máquinas cadastradas</h2>
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Equipamento</th>
                    <th>Setor</th>
                    <th>Horas de Operação (mês)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaMaquinas">

            </tbody>
        </table>
    </main>
    
</body>
</html>
