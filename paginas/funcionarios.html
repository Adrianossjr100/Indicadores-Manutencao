<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Manutenção-Funcionários</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/formulario.css">
    <script src="/js/main.js" defer></script>
    <script src="/js/funcionarios.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <a href="/index.html" class="voltar">&larr; Página inicial</a>
        </nav>
        <h1>Funcionários</h1>
    </header>

    <main>
        <section class="formulario">
            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" placeholder="Ex.: 1001">

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Nome completo">

            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" placeholder="Ex.: Eletricista">

            <label for="tipo">Tipo de manutenção</label>
            <select id="tipo">
                <option value="">Selecione</option>
            </select>

            <label for="horasDia">Horas de trabalho por dia</label>
            <input type="number" id="horasDia" min="0" max="24" step="any" placeholder="Ex.: 8">

            <button type="button" id="btnCadastrar">Cadastrar</button>
            <p id="mensagem"></p>
        </section>

        <h2>Funcionários cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Matrícula</th>
                    <th>Nome</th>
                    <th>Cargo</th>
                    <th>Tipo de Manutenção</th>
                    <th>Horas por Dia</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaFuncionarios">

            </tbody>
        </table>
    </main>
    
</body>
</html>
